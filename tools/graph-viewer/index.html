<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WithHuman Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #d9dde4; --accent: #2f6fde;
    --group-bg: #eceff4; --group-border: #d3d9e2; --node-bg: #ffffff;
    --request: #4c7be0; --intent: #2bb3c0; --message: #8a63d2; --call: #9aa3b1; --other: #8b93a1;
    --segment: #3aa57a; --error: #d24c4c;
    --allow: #2f9e5b; --deny: #d64545; --review: #d9a21b;
    --flow: #aab2bf; --cause: #e0433b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa3b1; --line: #2e343e;
      --group-bg: #1d2129; --group-border: #313844; --node-bg: #252a33; --flow: #5d6675; --call: #6b7484;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg);
         color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 6px 0 0; }
  select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 4px 8px; }
  select { max-width: 380px; }
  .picker { position: relative; }
  #session-button { max-width: 520px; display: inline-flex; gap: 8px; align-items: center; text-align: left;
                    overflow: hidden; white-space: nowrap; }
  #session-button .clip { overflow: hidden; text-overflow: ellipsis; }
  #session-popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: min(680px, 94vw);
                     max-height: 72vh; display: flex; flex-direction: column; background: var(--panel);
                     border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  #session-popover[hidden] { display: none; }
  .picker-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px;
                  border-bottom: 1px solid var(--line); }
  .picker-tools input[type=search] { flex: 1 1 220px; font: inherit; color: var(--text); background: var(--bg);
                                     border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  #session-list { overflow: auto; padding: 4px 0 8px; }
  .session-day { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-size: 11px;
                 font-weight: 600; padding: 8px 12px 4px; }
  .session-item { display: block; width: 100%; text-align: left; cursor: pointer;
                  padding: 7px 12px; border-left: 3px solid transparent; }
  .session-item .actions { display: inline-flex; gap: 2px; }
  .session-item .actions button { border: 0; background: none; padding: 0 5px; color: var(--muted); font-size: 14px; line-height: 1.2; }
  .session-item .actions button:hover { color: var(--text); background: var(--line); }
  .session-item .actions .pinned { color: var(--review); }
  .session-item .actions .delete:hover { color: #fff; background: var(--deny); }
  .picker-message { padding: 6px 12px; }
  .session-item:hover, .session-item:focus { background: var(--bg); outline: none; }
  .session-item.current { border-left-color: var(--accent); background: var(--bg); }
  .session-item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .session-item .time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .session-item .folder { font-weight: 600; }
  .session-item .prompt { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .session-item .id { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; margin-left: auto; }
  .count { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; color: #fff; }
  button { cursor: pointer; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: var(--panel); padding: 5px 12px; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); white-space: nowrap; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .status { color: var(--muted); margin-left: auto; }
  .error { color: var(--deny); }
  main { flex: 1; display: flex; min-height: 0; }
  #graph { flex: 1; min-width: 0; }
  aside { width: 460px; flex: none; overflow: auto; background: var(--panel); padding: 14px; }
  #splitter { flex: none; width: 5px; cursor: col-resize; background: var(--line); touch-action: none; }
  #splitter:hover, #splitter.dragging { background: var(--accent); }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .empty { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  td { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 34%; white-space: nowrap; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .para { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .para.hidden { border-color: var(--deny); }
  .para.cause { border: 2px solid var(--cause); }
  .para .tag { margin-left: 0; margin-right: 4px; }
  .para small { color: var(--muted); display: block; margin-bottom: 2px; }
  .bars td:first-child { width: 42%; white-space: normal; }
  .bar { display: flex; align-items: center; gap: 6px; }
  .bar span { flex: none; height: 8px; border-radius: 4px; background: var(--muted); opacity: .45; }
  .bar.chosen span { background: var(--accent); opacity: 1; }
  .bar.this span { background: var(--cause); opacity: 1; }
  .bar b { font-weight: 600; min-width: 34px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--accent); color: #fff; margin-left: 4px; }
  details { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details h4 { font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .card > h3:first-child { margin-top: 0; }
  .verdict { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .verdict .badge { font-size: 14px; padding: 3px 10px; }
  .verdict strong { font-size: 14px; }
  .callline { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg);
              border-radius: 6px; padding: 6px 8px; margin: 8px 0 4px; word-break: break-word; }
  .muted { color: var(--muted); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; }
  .gauge { position: relative; margin: 22px 0 4px; }
  .gauge .zones { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
  .gauge .zones i { display: block; height: 100%; opacity: .75; }
  .gauge .marker { position: absolute; top: -20px; transform: translateX(-50%); font-size: 11px; font-weight: 700;
                   white-space: nowrap; }
  .gauge .marker::after { content: ''; display: block; width: 2px; height: 22px; background: var(--text); margin: 1px auto 0; }
  table.breach td { padding: 4px 6px; }
  table.breach td:first-child { width: auto; white-space: normal; color: var(--text); }
  table.breach tr.worst td { font-weight: 600; }
  table.breach tr.zero td { color: var(--muted); }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .goto { color: var(--accent); cursor: pointer; }
  .goto:hover { text-decoration: underline; }
  .preview { color: var(--muted); font-size: 12px; margin: 2px 0 6px; white-space: pre-wrap; word-break: break-word; }
  details.section { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 8px 0 4px; margin: 0; }
  details.section > summary { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #splitter { display: none; }
    aside { width: auto !important; height: 45vh; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>WithHuman Graph</h1>
  <div class="picker">
    <button id="session-button" type="button" aria-haspopup="listbox" aria-expanded="false">세션 불러오는 중…</button>
    <div id="session-popover" hidden>
      <div class="picker-tools">
        <input id="session-search" type="search" placeholder="프롬프트, 의도, 폴더, 세션 ID 검색" aria-label="세션 검색">
        <select id="session-folder" aria-label="폴더"><option value="">모든 폴더</option></select>
        <label><input id="session-flagged" type="checkbox"> 차단·확인 있는 세션만</label>
      </div>
      <div id="session-message" class="picker-message" hidden></div>
      <div id="session-list" role="listbox" aria-label="세션"></div>
    </div>
  </div>
  <span class="tabs" role="group" aria-label="보기">
    <button type="button" data-view="tree" aria-pressed="true">원인 트리</button>
    <button type="button" data-view="flow" aria-pressed="false">시간 흐름</button>
  </span>
  <button id="reload" type="button">새로고침</button>
  <button id="fit" type="button">전체 보기</button>
  <label><input id="live" type="checkbox"> 자동 갱신(3초)</label>
  <span class="legend">
    <span><i style="background:var(--request)"></i>요청</span>
    <span><i style="background:var(--intent)"></i>의도</span>
    <span><i style="background:var(--message)"></i>메시지</span>
    <span><i style="background:var(--segment)"></i>결과</span>
    <span><i style="background:var(--allow)"></i>ALLOW</span>
    <span><i style="background:var(--deny)"></i>DENY</span>
    <span><i style="background:var(--cause)"></i>원인</span>
  </span>
  <span class="status" id="status"></span>
</header>
<main>
  <div id="graph"></div>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="패널 폭 조절"></div>
  <aside id="panel"><p class="empty">노드를 누르면 여기에 속성이 나옵니다. Call을 누르면 그 Call의 원인선이 강조됩니다.</p></aside>
</main>
<script>
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const KIND_COLOR = { Request: '--request', Intent: '--intent', Message: '--message', Call: '--call', Segment: '--segment', Error: '--error' };
const DECISION_COLOR = { ALLOW: '--allow', DENY: '--deny', REVIEW: '--review' };
const ICON = { Request: '👤', Intent: '🎯', Message: '💬', Segment: '📄', Error: '⚠', ConfigChange: '⚙', SubagentStart: '⤵', SubagentStop: '⤴' };
const LEAD = new Set(['Request', 'Intent', 'Message']);
const RESULT = new Set(['Segment', 'Error']);
const HIDDEN = new Set(['ToolBatch', 'ToolDescriptions']);
const $ = id => document.getElementById(id);
let cy, current = null, liveTimer = null, lastData = null, lastSignature = '', model = null, view = 'tree';

function parse(json) {
  if (typeof json !== 'string') return null;
  try { return JSON.parse(json); } catch { return null; }
}
const flat = text => String(text ?? '').replace(/\s+/g, ' ').trim();
const clip = (text, n) => { const f = flat(text); return f.length > n ? f.slice(0, n) + '…' : f; };
const time = ms => ms ? new Date(ms).toLocaleString() : '';
const percent = p => typeof p === 'number' ? p.toFixed(2).replace(/\.?0+$/, '') : '';
function escape(text) {
  return String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// A ToolBatch is drawn as what came before it, so every edge lands on a node that is on screen.
function build(data) {
  const bySeq = new Map(data.nodes.map(node => [node.props.seq, node]));
  const callOf = new Map(), resultsOf = new Map(), previous = new Map();
  for (const e of data.edges) {
    if (e.type === 'RESULT_OF' && bySeq.has(e.target)) callOf.set(e.source, e.target);
    if (e.type === 'NEXT' && e.props.kind !== 'cause') previous.set(e.target, e.source);
  }
  for (const [result, call] of callOf) {
    if (!resultsOf.has(call)) resultsOf.set(call, []);
    resultsOf.get(call).push(bySeq.get(result));
  }
  const shown = node => !HIDDEN.has(node.kind);
  const rep = (seq, depth = 0) => {
    const node = bySeq.get(seq);
    if (!node || depth > 50) return null;
    if (shown(node)) return seq;
    return previous.has(seq) ? rep(previous.get(seq), depth + 1) : null;
  };
  const flows = new Map();
  for (const e of data.edges) {
    if (e.type !== 'NEXT' || e.props.kind === 'cause') continue;
    const a = rep(e.source), b = rep(e.target);
    if (a != null && b != null && a !== b) flows.set(`${a}-${b}`, { from: a, to: b });
  }
  const causes = data.edges.filter(e => e.props.kind === 'cause')
    .map(e => ({ from: rep(e.source), to: rep(e.target), via: e.target, paragraph: e.paragraph, props: e.props }))
    .filter(c => c.from != null && c.to != null && c.from !== c.to);
  const groupOf = new Map();
  data.subgraphs.forEach(s => s.members.forEach(seq => groupOf.set(seq, s.props.number)));
  const nodes = data.nodes.filter(shown);
  const subgraphParent = new Map(data.subgraphs.map(s => [s.props.number, s.props.parent]));
  return { bySeq, callOf, resultsOf, groupOf, subgraphParent, nodes, flows: [...flows.values()], causes };
}

function label(node) {
  const s = node.summary || {};
  switch (node.kind) {
    case 'Request': return `${ICON.Request} ${clip(s.prompt, 26)}`;
    case 'Intent': return `${ICON.Intent} ${clip(s.intent, 26)}`;
    case 'Message': return `${ICON.Message} ${clip(s.text, 26)}`;
    case 'Call': return clip(`${s.tool_name || 'Call'} ${s.brief || ''}`, 28);
    case 'Segment': return `${ICON.Segment} ${clip(`${s.tool_name || ''} 결과`, 26)}`;
    case 'Error': return `${ICON.Error} ${clip(`${s.tool_name || ''} 오류 ${s.error || ''}`, 26)}`;
    case 'ConfigChange': return `${ICON.ConfigChange} ${clip(s.file_path, 24)}`;
    default: return `${ICON[node.kind] || ''} ${node.kind}`;
  }
}

function nodeData(node, parent) {
  const decision = node.props.decision;
  const color = css(KIND_COLOR[node.kind] || '--other');
  const soft = LEAD.has(node.kind) || RESULT.has(node.kind);
  return {
    id: `n${node.props.seq}`, parent, seq: node.props.seq, kind: node.kind, label: label(node),
    fill: soft ? color : css('--node-bg'),
    border: decision ? css(DECISION_COLOR[decision] || '--other') : color,
    borderWidth: decision ? 3 : 1.5, soft,
  };
}

const W = 190, H = 48, COLUMN_GAP = 36;

// A SubGraph's nodes in columns: its prompt, intent or message, then its Calls, each with its
// results beside it. Positions are node centres relative to the area's top left.
function arrange(list) {
  const leads = list.filter(n => LEAD.has(n.kind)).sort((a, b) => a.props.order - b.props.order);
  const inArea = new Set(list.map(n => n.props.seq));
  const calls = list.filter(n => !LEAD.has(n.kind) && !(RESULT.has(n.kind) && inArea.has(model.callOf.get(n.props.seq))))
    .sort((a, b) => a.props.order - b.props.order);
  const callX = leads.length ? W + COLUMN_GAP : 0;
  const resultX = callX + W + COLUMN_GAP;
  const rows = [];
  for (const call of calls) {
    const results = (model.resultsOf.get(call.props.seq) || []).filter(r => inArea.has(r.props.seq));
    rows.push({ call, results });
  }
  const callRows = rows.reduce((n, row) => n + Math.max(1, row.results.length), 0);
  const height = Math.max(leads.length, callRows, 1) * H;
  const items = [];
  const leadTop = (height - leads.length * H) / 2;
  leads.forEach((node, i) => items.push({ node, x: W / 2, y: leadTop + i * H + H / 2 }));
  let y = (height - callRows * H) / 2;
  for (const { call, results } of rows) {
    const span = Math.max(1, results.length) * H;
    items.push({ node: call, x: callX + W / 2, y: y + span / 2 });
    results.forEach((result, i) => items.push({ node: result, x: resultX + W / 2, y: y + i * H + H / 2 }));
    y += span;
  }
  const hasResults = rows.some(row => row.results.length);
  const width = (hasResults ? resultX : calls.length ? callX : 0) + W;
  return { items, width, height };
}

function areasOf() {
  const areas = new Map();
  for (const node of model.nodes) {
    const number = model.groupOf.get(node.props.seq);
    const key = number === undefined ? 'loose' : number;
    if (!areas.has(key)) areas.set(key, []);
    areas.get(key).push(node);
  }
  return new Map([...areas].map(([key, list]) => [key, arrange(list)]));
}

function areaElements(key, area, left, top, elements) {
  const parent = `g${key}`;
  elements.push({ group: 'nodes', data: { id: parent, area: true, label: key === 'loose' ? '서브그래프 없음' : `S${key}` } });
  for (const item of area.items) {
    elements.push({ group: 'nodes', data: nodeData(item.node, parent), position: { x: left + item.x, y: top + item.y } });
  }
}

function causeEdges(elements, onScreen) {
  for (const c of model.causes) {
    if (!onScreen.has(c.from) || !onScreen.has(c.to)) continue;
    elements.push({ group: 'edges', data: {
      id: `c${c.from}-${c.via}-${c.paragraph ?? ''}`, source: `n${c.from}`, target: `n${c.to}`, cause: true,
      label: `${c.paragraph != null ? `¶${c.paragraph} ` : ''}${percent(c.props.probability)}`, props: c.props } });
  }
}

// The flow view: SubGraph areas left to right, joined by the order of events.
function flowElements() {
  const areas = areasOf();
  const keys = [...areas.keys()].sort((a, b) => (a === 'loose') - (b === 'loose') || a - b);
  const elements = [];
  let left = 0;
  for (const key of keys) {
    const area = areas.get(key);
    areaElements(key, area, left, -area.height / 2, elements);
    left += area.width + 90;
  }
  for (const f of model.flows) elements.push({ group: 'edges', data: { id: `f${f.from}-${f.to}`, source: `n${f.from}`, target: `n${f.to}`, flow: true } });
  causeEdges(elements, new Set(model.nodes.map(n => n.props.seq)));
  return { elements, layout: { name: 'preset' } };
}

// The cause tree: each SubGraph area under the SubGraph its Calls were traced to (its
// `parent`), the session's first prompt on top. A SubGraph that was not traced, such as a
// closing message or a later prompt, hangs under the SubGraph the events came from, joined by
// that order edge. Cause edges run from each Call up to its cause in the parent area.
function treeElements() {
  const GAP_X = 60, GAP_Y = 110;
  const areas = areasOf();
  areas.delete('loose');
  const numbers = [...areas.keys()].sort((a, b) => a - b);
  const parentOf = new Map(), byOrder = new Set();
  const areaOf = seq => model.groupOf.get(seq);
  for (const number of numbers) {
    const key = model.subgraphParent.get(number);
    const parent = /^s\d+$/.test(key || '') ? Number(key.slice(1)) : null;
    if (parent !== null && parent < number && areas.has(parent)) { parentOf.set(number, parent); continue; }
    const before = model.flows.map(f => areaOf(f.from))
      .filter((from, i) => areaOf(model.flows[i].to) === number && from < number && areas.has(from));
    if (before.length) { parentOf.set(number, Math.max(...before)); byOrder.add(number); }
  }
  const children = new Map(numbers.map(n => [n, []]));
  for (const [child, parent] of parentOf) children.get(parent).push(child);
  const roots = numbers.filter(n => !parentOf.has(n));

  // A subtree is as wide as its children side by side, or its own area.
  const width = new Map();
  const measure = n => {
    const kids = children.get(n).reduce((sum, c) => sum + measure(c) + GAP_X, -GAP_X);
    width.set(n, Math.max(areas.get(n).width, kids));
    return width.get(n);
  };
  roots.forEach(measure);
  const depth = new Map(), left = new Map();
  const place = (n, start, level) => {
    depth.set(n, level);
    left.set(n, start + (width.get(n) - areas.get(n).width) / 2);
    const kidsWidth = children.get(n).reduce((s, c) => s + width.get(c) + GAP_X, -GAP_X);
    let x = start + (width.get(n) - kidsWidth) / 2;
    for (const c of children.get(n)) { place(c, x, level + 1); x += width.get(c) + GAP_X; }
  };
  let x = 0;
  for (const root of roots) { place(root, x, 0); x += width.get(root) + GAP_X * 2; }
  const levelHeight = [];
  for (const n of numbers) levelHeight[depth.get(n)] = Math.max(levelHeight[depth.get(n)] || 0, areas.get(n).height);
  const levelTop = [];
  levelHeight.forEach((h, d) => { levelTop[d] = d === 0 ? 0 : levelTop[d - 1] + levelHeight[d - 1] + GAP_Y; });

  const elements = [];
  for (const n of numbers) areaElements(n, areas.get(n), left.get(n), levelTop[depth.get(n)], elements);
  const onScreen = new Set(elements.filter(e => e.data.seq !== undefined).map(e => e.data.seq));
  for (const f of model.flows) {
    if (!onScreen.has(f.from) || !onScreen.has(f.to)) continue;
    const from = areaOf(f.from), to = areaOf(f.to);
    const joins = from === to || (byOrder.has(to) && parentOf.get(to) === from);
    if (joins) elements.push({ group: 'edges', data: { id: `f${f.from}-${f.to}`, source: `n${f.from}`, target: `n${f.to}`, flow: true } });
  }
  causeEdges(elements, onScreen);
  return { elements, layout: { name: 'preset' } };
}

function render(data, keepView) {
  model = build(data);
  const saved = keepView && cy ? { zoom: cy.zoom(), pan: cy.pan(), selected: cy.$('node:selected').id() } : null;
  cy?.destroy();
  const { elements, layout } = view === 'flow' ? flowElements() : treeElements();
  cy = cytoscape({ container: $('graph'), elements, style: style(), layout,
    wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 3, autoungrabify: false });
  if (saved) { cy.zoom(saved.zoom); cy.pan(saved.pan); if (saved.selected) select(cy.$id(saved.selected)); }
  else cy.fit(undefined, 40);
  cy.on('tap', 'node[seq]', event => { select(event.target); show(event.target.data('seq')); });
  cy.on('tap', 'edge[?cause]', event => {
    selectEdge(event.target);
    showEdge(event.target.source().data('seq'), event.target.target().data('seq'));
  });
  cy.on('tap', event => { if (event.target === cy) select(null); });
}

// The chain a Call was traced along: the Call, the result that caused it, the Call that result
// came from, and so on up to the prompt.
function chainOf(seq) {
  const nodes = new Set(), edges = new Set(), seen = new Set(), steps = [];
  const walk = (call, depth) => {
    if (seen.has(call)) return;
    seen.add(call);
    nodes.add(`n${call}`);
    steps.push({ seq: call, depth });
    for (const c of model.causes.filter(c => c.from === call)) {
      edges.add(`c${c.from}-${c.via}-${c.paragraph ?? ''}`);
      nodes.add(`n${c.to}`);
      steps.push({ seq: c.to, depth: depth + 1, probability: c.props.probability });
      const origin = model.callOf.get(c.to);
      if (origin !== undefined) { edges.add(`f${origin}-${c.to}`); walk(origin, depth + 2); }
    }
  };
  walk(seq, 0);
  return { nodes, edges, steps };
}

// Selecting a Call paints its chain red and fades the rest.
function select(node) {
  cy.elements().removeClass('faded chain');
  cy.$(':selected').unselect();
  if (!node || !node.length) return;
  node.select();
  const { nodes, edges } = chainOf(node.data('seq'));
  if (edges.size === 0) return;
  const chain = cy.collection();
  nodes.forEach(id => { chain.merge(cy.$id(id)); });
  edges.forEach(id => { chain.merge(cy.$id(id)); });
  chain.addClass('chain');
  cy.elements().not(chain).not('node[?area]').addClass('faded');
}

// Selecting a cause edge picks out it and its two ends.
function selectEdge(edge) {
  cy.elements().removeClass('faded chain');
  cy.$(':selected').unselect();
  const picked = edge.union(edge.connectedNodes());
  picked.addClass('chain');
  cy.elements().not(picked).not('node[?area]').addClass('faded');
}

const row = (key, value) => {
  const parsed = /_json$/.test(key) ? parse(value) : null;
  const shown = parsed !== null
    ? `<details><summary class="muted">JSON · ${String(value).length}자</summary><pre>${escape(JSON.stringify(parsed, null, 2))}</pre></details>`
    : /(_at|^observed_at)$/.test(key) && typeof value === 'number' ? `${value} <span class="empty">(${time(value)})</span>`
    : typeof value === 'object' ? `<pre>${escape(JSON.stringify(value, null, 2))}</pre>`
    : escape(String(value));
  return `<tr><td>${escape(key)}</td><td>${shown}</td></tr>`;
};
const table = props => `<table>${Object.keys(props).sort().map(k => row(k, props[k])).join('')}</table>`;

const subgraphName = key => key === 'none' ? '해당 없음 (none)' : /^s\d+$/.test(key) ? `S${key.slice(1)}` : key;
const bar = (p, cls = '') => `<div class="bar ${cls}"><b>${percent(p)}</b><span style="width:${Math.round((p || 0) * 140)}px"></span></div>`;
function nodeName(seq) {
  const node = model.bySeq.get(seq);
  if (!node) return `#${seq}`;
  const s = node.summary || {};
  return `#${seq} ${node.kind} ${clip(s.tool_name ? `${s.tool_name} ${s.brief || ''}` : s.prompt || s.text || s.intent || '', 40)}`;
}

// An answer's options by name, the chosen ones marked, and the result an edge points at.
function resultHtml(question, answer, trace, highlight) {
  if (answer?.noul != null) return `<table class="bars"><tr><td>참일 확률</td><td>${bar(answer.noul)}</td></tr></table>`;
  // A tool result is `g<seq>`, one of its paragraphs `g<seq>p<index>`.
  const activated = new Set((trace.segments || []).map(x => `${x.seq}:${x.paragraph ?? ''}`));
  const rows = Object.entries(answer?.probabilities || {}).sort((a, b) => b[1] - a[1]).map(([option, p]) => {
    const match = /^g(\d+)(?:p(\d+))?$/.exec(option);
    const seq = match ? Number(match[1]) : null;
    const paragraph = match?.[2] ?? '';
    // A candidate itself (its Request, or `none`) rather than one of its tool results.
    const whole = (question === 'parent' || question === 'cause') && seq === null;
    const name = whole ? subgraphName(option)
      : seq !== null ? `${nodeName(seq)}${paragraph !== '' ? ` ¶${paragraph}` : ''}` : option;
    const chosen = whole ? (trace.parents || []).some(x => x.key === option) || option === trace.parent
      : seq !== null ? activated.has(`${seq}:${paragraph}`)
      : question === 'expected' && option === trace.deviation?.worst;
    const cls = seq !== null && seq === highlight ? 'this' : chosen ? 'chosen' : '';
    const tag = chosen ? `<span class="tag">${whole ? '선택' : seq !== null ? '원인' : '최대 위반'}</span>` : '';
    return `<tr><td>${escape(name)}${tag}</td><td>${bar(p, cls)}</td></tr>`;
  }).join('');
  return rows ? `<table class="bars">${rows}</table>` : `<pre>${escape(JSON.stringify(answer, null, 2))}</pre>`;
}


const RULE_TEXT = {
  'intent::mismatch': '의도에서 벗어난 행동으로 차단',
  'intent::review': '의도에서 벗어났을 수 있어 사용자 확인',
  'intent::match': '의도 안의 행동',
  'intent::unknown': '의도가 기록되지 않아 판정 없음',
  'trace::unresolved': '원인 추적 실패',
  'trace::no_subgraph': '추적할 SubGraph 없음',
  'cause::none': '원인 없음으로 차단 (이전 규칙)',
};
const LINK_TEXT = { request: '사용자 요청의 다음 단계', segment: '도구 결과의 내용', none: '요청·결과와 무관' };
const BREACH_TEXT = {
  none: '위반 없음',
  explicit: '사용자가 말한 목표·조건을 어김',
  unrelated_change: '요청과 관계없는 파일·저장소를 바꿈',
  exfiltration: '사용자 데이터·비밀값을 외부로 보냄',
  unconfirmed_irreversible: '되돌릴 수 없는 작업을 묻지 않고 함',
  security_change: '권한·인증·보안 설정을 바꿈',
  out_of_scope_access: '요청 범위 밖 시스템·계정에 접근',
  hijacked_goal: '도구 결과가 끌어들인 새 목표를 따름',
};
const PROCESS = new Set(['out_of_scope_access', 'hijacked_goal']);
// Defaults of the Decision Module, for traces stored before they were recorded.
const THRESHOLDS = { request: { deny: 0.3, review: 0.15 }, segment: { deny: 0.15, review: 0.08 }, none: { deny: 0.15, review: 0.08 } };
const harmText = h => h >= 0.7 ? '큼' : h >= 0.2 ? '작음' : '없음';
const goto = (seq, text) => `<span class="goto" data-seq="${seq}">${escape(text)}</span>`;

// The cause answer, by what the Call can follow from.
function causeShares(trace) {
  const answer = (trace.jev || []).find(x => x.stage === 'cause')?.response?.answers?.cause;
  const probabilities = answer?.probabilities || {};
  const shares = { request: 0, segment: 0, none: 0 };
  for (const [option, p] of Object.entries(probabilities)) {
    if (/^g\d+/.test(option)) shares.segment += p;
    else if (option === 'none') shares.none += p;
    else shares.request += p;
  }
  return Object.keys(probabilities).length ? shares : null;
}

// What the Call follows from: its link, the three shares, and the results it was traced to.
function causeHtml(trace) {
  const link = trace.link;
  const shares = causeShares(trace);
  const rows = shares ? ['request', 'segment', 'none'].map(key =>
    `<tr><td>${escape(LINK_TEXT[key])}${key === link ? '<span class="tag">선택</span>' : ''}</td><td>${bar(shares[key], key === link ? 'chosen' : '')}</td></tr>`).join('') : '';
  const segments = (trace.segments || []).map(x => `<div>${goto(x.seq, `${nodeName(x.seq)}${x.paragraph != null ? ` ¶${x.paragraph}` : ''}`)}
      <span class="muted">· p=${percent(x.probability)}</span></div>
      <div class="preview" data-preview="${x.seq}:${x.paragraph ?? ''}"></div>`).join('');
  return `<div class="card"><h3>원인</h3>
    <dl class="facts">
      <dt>연결</dt><dd><strong>${escape(LINK_TEXT[link] || link || '–')}</strong>${trace.picked === false ? ' <span class="muted">(Jev 답 없음 · 가장 가까운 SubGraph로 대체)</span>' : ''}</dd>
      <dt>부모</dt><dd>${escape(subgraphName(trace.parent || ''))}</dd>
    </dl>
    ${rows ? `<table class="bars">${rows}</table>` : ''}
    ${segments ? `<h4 class="muted">원인이 된 도구 결과</h4>${segments}` : ''}</div>`;
}

// The deviation on a gauge split where the Call would be reviewed and denied, and what each
// breach added.
function deviationHtml(trace) {
  const d = trace.deviation;
  if (!d) return '';
  const t = trace.thresholds || THRESHOLDS[trace.link] || THRESHOLDS.request;
  const zones = [[t.review, '--allow'], [t.deny - t.review, '--review'], [1 - t.deny, '--deny']]
    .map(([w, color]) => `<i style="width:${Math.max(0, w) * 100}%;background:var(${color})"></i>`).join('');
  const contributions = d.contributions || { explicit: null, ...Object.fromEntries(Object.keys(d.expected || {}).map(k => [k, null])) };
  const probability = key => key === 'explicit' ? d.explicit : d.expected?.[key];
  const rows = Object.entries(contributions)
    .filter(([key, score]) => key !== 'none' && (score > 0.001 || probability(key) > 0.05))
    .sort((a, b) => (b[1] ?? 0) - (a[1] ?? 0))
    .map(([key, score]) => `<tr class="${key === d.worst ? 'worst' : score > 0.001 ? '' : 'zero'}">
      <td>${escape(BREACH_TEXT[key] || key)}${PROCESS.has(key) ? ' <span class="muted">(과정형)</span>' : ''}${key === d.worst ? '<span class="tag">최대</span>' : ''}</td>
      <td class="num">${probability(key) == null ? '–' : percent(probability(key)) || '0'}</td><td class="num">${score == null ? '–' : percent(score) || '0'}</td></tr>`).join('');
  return `<div class="card"><h3>이탈 점수</h3>
    <div class="gauge"><div class="marker" style="left:${Math.min(1, d.score) * 100}%">${percent(d.score) || '0'}</div><div class="zones">${zones}</div></div>
    <p class="muted">허용 &lt; ${percent(t.review)} ≤ 확인 &lt; ${percent(t.deny)} ≤ 차단
      · ${escape(LINK_TEXT[trace.link] || '')}에 이어진 Call의 기준${trace.thresholds ? '' : ' (기본값)'}</p>
    ${rows ? `<table class="breach"><tr><td class="muted">위반</td><td class="num muted">확률</td><td class="num muted">점수</td></tr>${rows}</table>`
      : '<p>어긴 것이 없습니다.</p>'}
    <dl class="facts">
      <dt>피해</dt><dd>${harmText(d.harm)} <span class="muted">(${percent(d.harm) || '0'})</span></dd>
      <dt>되돌릴 수 없음</dt><dd>${percent(d.irreversible) || '0'}</dd>
    </dl></div>`;
}

// A Call's verdict at a glance: the decision, why, what Call it was, and the reason the agent saw.
function verdictHtml(props, trace) {
  const payload = parse(props.payload_json) || {};
  const call = `${payload.tool_name || ''}${model.bySeq.get(props.seq)?.summary?.brief ? ': ' + model.bySeq.get(props.seq).summary.brief : ''}`;
  const score = trace?.deviation ? `<span class="muted">이탈 ${percent(trace.deviation.score) || '0'}</span>`
    : props.intent_score != null ? `<span class="muted">score ${percent(props.intent_score)}</span>` : '';
  return `<div class="card">
    <div class="verdict"><span class="badge" style="background:${css(DECISION_COLOR[props.decision] || '--other')}">${escape(props.decision)}</span>
      <strong>${escape(RULE_TEXT[props.decision_rule] || props.decision_rule || '')}</strong> ${score}</div>
    <div class="callline">${escape(call)}</div>
    ${props.decision_reason ? `<p class="muted">${escape(props.decision_reason)}</p>` : ''}
    <p class="muted">${escape(props.decision_rule || '')}${trace?.jev_ms ? ` · Jev ${trace.jev_ms.judge ?? '–'}ms` : ''}</p></div>`;
}

const section = (title, body, open = false) => body
  ? `<details class="section"${open ? ' open' : ''}><summary>${escape(title)}</summary>${body}</details>` : '';

// Fills each cause's preview with its paragraph, or the start of its result.
async function fillPreviews(seq) {
  const wanted = [...document.querySelectorAll('[data-preview]')];
  const bySeq = new Map();
  for (const el of wanted) {
    const [result] = el.dataset.preview.split(':');
    if (!bySeq.has(result)) bySeq.set(result, api(`/api/node?session=${encodeURIComponent(current)}&seq=${result}`).catch(() => null));
  }
  for (const el of wanted) {
    const [result, index] = el.dataset.preview.split(':');
    const detail = await bySeq.get(result);
    if (shownSeq !== seq) return;
    const paragraph = index !== '' ? detail?.paragraphs?.find(p => p.index === Number(index)) : null;
    const payload = parse(detail?.props?.payload_json) || {};
    const text = paragraph ? `${paragraph.hidden ? '[숨김] ' : ''}${paragraph.text}`
      : JSON.stringify(payload.tool_response ?? payload.error ?? '');
    el.textContent = clip(text, 240);
  }
}

// Each Jev request as it was sent, its state and questions, with its answers.
function jevHtml(trace, highlight) {
  if (!trace.jev?.length) {
    return `<p class="empty">이 판정에는 Jev state·question이 저장되어 있지 않습니다 (기록을 남기기 전 판정).</p>
      <h4>결과 · parent</h4>${resultHtml('parent', { probabilities: trace.influence }, trace, highlight)}`;
  }
  return trace.jev.map(exchange => {
    const state = Object.entries(exchange.request?.state || {}).map(([key, value]) =>
      `<details><summary>${escape(key)}</summary><pre>${escape(typeof value === 'string' ? value : JSON.stringify(value, null, 2))}</pre></details>`).join('');
    const questions = Object.entries(exchange.request?.questions || {}).map(([key, q]) =>
      `<details><summary>${escape(key)} <span class="empty">(${escape(q.type)})</span></summary><pre>${escape(q.instructions)}\n\n${escape(JSON.stringify(q.criteria, null, 2))}</pre></details>`).join('');
    const results = Object.entries(exchange.response?.answers || {}).map(([key, answer]) =>
      `<h4>${escape(key)}</h4>${resultHtml(key, answer, trace, highlight)}`).join('');
    const output = `<details><summary>answers</summary><pre>${escape(JSON.stringify(exchange.response?.answers, null, 2))}</pre></details>`;
    const title = exchange.stage === 'parent' ? 'parent 질문'
      : exchange.stage === 'cause' ? '원인 질문'
      : exchange.stage === 'paragraph' ? `${nodeName(exchange.seq)} 문단 질문` : `${subgraphName(exchange.parent)} 질문`;
    return `<h3>${escape(title)}</h3>
      <h4>입력 · state</h4>${state}<h4>입력 · question</h4>${questions}
      <h4>출력</h4>${output}
      <h4>결과</h4>${results}`;
  }).join('');
}

// The chain the Call was traced along, as the red path on the graph shows it.
function pathHtml(seq) {
  const { steps } = chainOf(seq);
  if (steps.length < 2) return '';
  const rows = steps.map(step => `<div style="padding-left:${step.depth * 12}px">${step.depth ? '↑ ' : ''}${escape(nodeName(step.seq))}${step.probability != null ? ` <span class="empty">원인 p=${percent(step.probability)}</span>` : ''}</div>`).join('');
  return `<h3>경로</h3><div>${rows}</div>`;
}

// The Calls traced to each paragraph of the tool result `seq`, by paragraph index.
function paragraphCauses(seq) {
  const byIndex = new Map();
  for (const c of model.causes) {
    if (c.via !== seq || c.paragraph == null) continue;
    if (!byIndex.has(c.paragraph)) byIndex.set(c.paragraph, []);
    byIndex.get(c.paragraph).push(c);
  }
  return byIndex;
}

// A paragraph of a tool result, outlined in red with the Calls traced to it when it is a cause.
function paragraphHtml(p, causes = []) {
  const tags = causes.map(c =>
    `<span class="tag">원인 ← ${escape(nodeName(c.from))} ${percent(c.props.probability)}</span>`).join('');
  return `<div class="para${p.hidden ? ' hidden' : ''}${causes.length ? ' cause' : ''}">${tags}<small>#${p.index} · ${escape(p.source || '')}${p.hidden ? ' · hidden ' + escape(JSON.stringify(p.hidden_rules)) : ''}${p.instructs != null ? ' · instructs ' + p.instructs : ''}</small><pre>${escape(p.text || '')}</pre></div>`;
}

// A cause edge: the paragraphs it points at, the Jev requests behind it, what Jev returned, and
// what was chosen.
async function showEdge(callSeq, targetSeq) {
  shownSeq = null;
  const trace = parse(model.bySeq.get(callSeq)?.props.trace_json);
  const causes = model.causes.filter(c => c.from === callSeq && c.to === targetSeq);
  const cause = causes[0];
  const indexes = causes.filter(c => c.paragraph != null).map(c => c.paragraph);
  $('panel').innerHTML = `<h2>원인 엣지</h2>
    <p>${escape(nodeName(callSeq))}<br>→ ${escape(nodeName(targetSeq))}${indexes.length ? ` ¶${indexes.join(', ¶')}` : ''}${cause && !indexes.length ? ` <span class="empty">p=${percent(cause.props.probability)}</span>` : ''}</p>
    ${indexes.length ? '<h3>원인 문단</h3><div id="edge-paragraphs"><p class="empty">불러오는 중…</p></div>' : ''}
    ${trace ? causeHtml(trace) + deviationHtml(trace) + section('Jev 원본 (state · question · answer)', jevHtml(trace, targetSeq), true)
      : '<p class="empty">판정 기록이 없습니다.</p>'}`;
  if (!indexes.length) return;
  const edge = `${callSeq}-${targetSeq}`;
  shownEdge = edge;
  try {
    const detail = await api(`/api/node?session=${encodeURIComponent(current)}&seq=${cause.via}`);
    if (shownEdge !== edge) return;
    $('edge-paragraphs').innerHTML = (detail?.paragraphs || [])
      .filter(p => indexes.includes(p.index))
      .map(p => paragraphHtml(p, causes.filter(c => c.paragraph === p.index)))
      .join('') || '<p class="empty">문단을 찾지 못했습니다.</p>';
  } catch (error) {
    $('edge-paragraphs').innerHTML = `<p class="error">${escape(error.message)}</p>`;
  }
}

let shownEdge = null;

let shownSeq = null;
async function show(seq, highlight = null) {
  const node = model.bySeq.get(seq);
  if (!node) return;
  shownSeq = seq;
  shownEdge = null;
  const props = node.props;
  const trace = parse(props.trace_json);
  const isCall = Boolean(props.decision || props.trace_error);
  const head = `<h2>#${props.seq} ${escape(node.kind)}</h2>`;
  const decision = props.decision
    ? `${verdictHtml(props, trace)}${trace ? causeHtml(trace) + deviationHtml(trace) : ''}
       ${pathHtml(seq) ? `<div class="card">${pathHtml(seq)}</div>` : ''}
       ${trace ? section(`사용자 의도`, trace.intents ? `<pre>${escape(trace.intents)}</pre>` : '') : ''}
       ${trace ? section('이번 턴 흐름', trace.turn ? `<pre>${escape(trace.turn)}</pre>` : '') : ''}
       ${trace ? section('Jev 원본 (state · question · answer)', jevHtml(trace, highlight)) : ''}`
    : props.trace_error ? `<p class="error">판정 실패: ${escape(props.trace_error)}</p>` : '';
  const panel = $('panel');
  const paint = (detail, extra) => {
    const shownProps = detail?.props || props;
    panel.innerHTML = `${head}${decision}${isCall ? section('속성', table(shownProps)) : `<h3>속성</h3>${table(shownProps)}`}${extra}`;
  };
  paint(null, '<p class="empty">문단 · 토큰 불러오는 중…</p>');
  try {
    const detail = await api(`/api/node?session=${encodeURIComponent(current)}&seq=${props.seq}`);
    if (shownSeq !== seq) return;
    const traced = paragraphCauses(props.seq);
    const paragraphs = (detail?.paragraphs || []).map(p => paragraphHtml(p, traced.get(p.index))).join('');
    const tokens = (detail?.tokens || []).map(t =>
      `<tr><td>${escape(t.kind)} · ${escape(t.slot)}</td><td>${escape(String(t.decoded ?? ''))} <span class="empty">${escape(t.category || '')}</span></td></tr>`).join('');
    const tokenTitle = `토큰 (${detail?.tokens?.length || 0})`;
    const paragraphTitle = `문단 (${detail?.paragraphs?.length || 0})${traced.size ? ` · 원인 ${traced.size}개` : ''}`;
    paint(detail, isCall
      ? section(tokenTitle, tokens ? `<table>${tokens}</table>` : '') + section(paragraphTitle, paragraphs)
      : `<h3>${tokenTitle}</h3>${tokens ? `<table>${tokens}</table>` : '<p class="empty">없음</p>'}
         <h3>${escape(paragraphTitle)}${traced.size ? ' <span class="empty">· 빨간 테두리</span>' : ''}</h3>${paragraphs || '<p class="empty">없음</p>'}`);
    if (props.decision) fillPreviews(seq);
  } catch (error) {
    panel.insertAdjacentHTML('beforeend', `<p class="error">${escape(error.message)}</p>`);
  }
}

async function api(path) {
  const response = await fetch(path);
  const body = await response.json();
  if (!response.ok) throw new Error(body?.error || response.statusText);
  return body;
}

let sessions = [];
// Pinned sessions are kept per browser.
function pinned() {
  try { return new Set(JSON.parse(localStorage.getItem('pinnedSessions') || '[]')); } catch { return new Set(); }
}
function setPinned(ids) {
  try { localStorage.setItem('pinnedSessions', JSON.stringify([...ids])); } catch {}
}
// The last part of a path, whether it uses / or \.
const folderOf = cwd => String(cwd || '').split(/[\\/]/).filter(Boolean).pop() || '';
const hhmm = ms => ms ? new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
function dayOf(ms) {
  const day = new Date(ms); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - day) / 86400000);
  return days === 0 ? '오늘' : days === 1 ? '어제' : day.toLocaleDateString();
}
const counts = s => `${s.denied ? `<span class="count" style="background:var(--deny)">차단 ${s.denied}</span>` : ''}
  ${s.reviewed ? `<span class="count" style="background:var(--review)">확인 ${s.reviewed}</span>` : ''}
  <span class="muted">Call ${s.calls ?? 0}</span>`;

async function loadSessions() {
  sessions = await api('/api/sessions');
  const folders = [...new Set(sessions.map(s => folderOf(s.cwd)).filter(Boolean))].sort();
  const folder = $('session-folder');
  const chosen = folder.value;
  folder.innerHTML = '<option value="">모든 폴더</option>' +
    folders.map(f => `<option value="${escape(f)}">${escape(f)}</option>`).join('');
  folder.value = folders.includes(chosen) ? chosen : '';
  const wanted = decodeURIComponent(location.hash.slice(1)) || current;
  renderSessions();
  return sessions.some(s => s.id === wanted) ? wanted : sessions[0]?.id;
}

// The sessions matching the search and filters, by day, the most recently active first.
function renderSessions() {
  const query = $('session-search').value.trim().toLowerCase();
  const folder = $('session-folder').value;
  const flagged = $('session-flagged').checked;
  const latest = s => s.last_at || s.created_at;
  const shown = [...sessions].sort((a, b) => latest(b) - latest(a)).filter(s =>
    (!folder || folderOf(s.cwd) === folder) && (!flagged || s.denied || s.reviewed) &&
    (!query || [s.prompt, s.intent, s.cwd, s.id, s.client].some(v => String(v || '').toLowerCase().includes(query))));
  const pins = pinned();
  const item = s => {
    const at = s.last_at || s.created_at;
    const pin = pins.has(s.id);
    return `<div role="option" tabindex="0" class="session-item${s.id === current ? ' current' : ''}"
        data-session="${escape(s.id)}" aria-selected="${s.id === current}" title="${escape(s.cwd || '')}">
      <div class="top"><span class="time">${escape(hhmm(at))}</span>
        <span class="folder">${escape(folderOf(s.cwd) || '(폴더 없음)')}</span>${counts(s)}
        <span class="id">${escape(s.id.slice(0, 8))}</span>
        <span class="actions">
          <button type="button" data-pin="${escape(s.id)}" class="${pin ? 'pinned' : ''}" title="${pin ? '고정 해제' : '고정'}" aria-label="${pin ? '고정 해제' : '고정'}">${pin ? '★' : '☆'}</button>
          <button type="button" data-delete="${escape(s.id)}" class="delete" title="삭제" aria-label="삭제">🗑</button>
        </span></div>
      <div class="prompt">${escape(clip(s.prompt || s.intent || '(프롬프트 없음)', 140))}</div></div>`;
  };
  const top = shown.filter(s => pins.has(s.id));
  let day = null;
  $('session-list').innerHTML = (top.length ? `<div class="session-day">고정됨</div>${top.map(item).join('')}` : '') +
    shown.filter(s => !pins.has(s.id)).map(s => {
      const at = s.last_at || s.created_at;
      return `${dayOf(at) !== day ? `<div class="session-day">${escape(day = dayOf(at))}</div>` : ''}${item(s)}`;
    }).join('') || (top.length ? '' : '<p class="empty" style="padding:12px">맞는 세션이 없습니다.</p>');
}

function pickerMessage(text, error = false) {
  const box = $('session-message');
  box.hidden = !text;
  box.className = `picker-message${error ? ' error' : ' empty'}`;
  box.textContent = text || '';
}

function togglePin(id) {
  const ids = pinned();
  if (ids.has(id)) ids.delete(id); else ids.add(id);
  setPinned(ids);
  renderSessions();
}

// Deletes a session from the graph for good, after the user confirms which one.
async function deleteSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  const what = [folderOf(s.cwd), clip(s.prompt || s.intent || '', 80), s.id].filter(Boolean).join('\n');
  if (!confirm(`이 세션을 삭제할까요? 그래프에서 영구히 지워지고 되돌릴 수 없습니다.\n\n${what}`)) return;
  try {
    const response = await fetch(`/api/session?session=${encodeURIComponent(id)}`, { method: 'DELETE' });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body?.error || response.statusText);
    sessions = sessions.filter(x => x.id !== id);
    const ids = pinned(); ids.delete(id); setPinned(ids);
    if (id === current) { current = null; chooseSession(sessions[0]?.id); openPicker(true); }
    renderSessions();
    pickerMessage(`세션 ${id.slice(0, 8)}을 삭제했습니다 (노드 ${body.deleted ?? 0}개).`);
  } catch (error) {
    pickerMessage(`삭제하지 못했습니다: ${error.message}`, true);
  }
}

// The picker's button names the current session the way the list does.
function showCurrent() {
  const s = sessions.find(x => x.id === current);
  $('session-button').innerHTML = s
    ? `<span class="folder">${escape(folderOf(s.cwd) || s.id.slice(0, 8))}</span>
       <span class="clip muted">${escape(clip(s.prompt || s.intent || '', 60))}</span>${counts(s)} ▾`
    : '세션 선택 ▾';
}

function openPicker(open) {
  $('session-popover').hidden = !open;
  if (!open) pickerMessage('');
  $('session-button').setAttribute('aria-expanded', String(open));
  if (open) { renderSessions(); $('session-search').focus(); }
}

function chooseSession(id) {
  openPicker(false);
  if (!id || id === current) return;
  current = id; location.hash = encodeURIComponent(current); lastSignature = '';
  showCurrent();
  $('panel').innerHTML = '<p class="empty">노드를 누르면 여기에 속성이 나옵니다. Call을 누르면 그 Call의 원인선이 강조됩니다.</p>';
  loadGraph(false);
}

async function loadGraph(keepView) {
  if (!current) return;
  $('status').textContent = '불러오는 중…';
  try {
    const data = await api(`/api/graph?session=${encodeURIComponent(current)}`);
    const signature = JSON.stringify(data);
    if (!keepView || signature !== lastSignature) render(data, keepView);
    lastData = data;
    lastSignature = signature;
    $('status').textContent = `노드 ${data.nodes.length} · 서브그래프 ${data.subgraphs.length} · ${new Date().toLocaleTimeString()}`;
  } catch (error) {
    $('status').innerHTML = `<span class="error">${escape(error.message)}</span>`;
  }
}

document.querySelectorAll('.tabs button').forEach(button => button.addEventListener('click', () => {
  view = button.dataset.view;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  if (lastData) render(lastData, false);
}));
$('session-button').addEventListener('click', () => openPicker($('session-popover').hidden));
$('session-list').addEventListener('click', event => {
  const pin = event.target.closest('[data-pin]'), remove = event.target.closest('[data-delete]');
  if (pin) togglePin(pin.dataset.pin);
  else if (remove) deleteSession(remove.dataset.delete);
  else chooseSession(event.target.closest('[data-session]')?.dataset.session);
});
$('session-list').addEventListener('keydown', event => {
  const item = event.target.closest('[data-session]');
  if (item && event.key === 'Enter' && event.target === item) chooseSession(item.dataset.session);
});
['session-search', 'session-folder', 'session-flagged'].forEach(id => $(id).addEventListener('input', renderSessions));
$('session-search').addEventListener('keydown', event => {
  if (event.key === 'Enter') chooseSession($('session-list').querySelector('[data-session]')?.dataset.session);
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') openPicker(false); });
document.addEventListener('click', event => { if (!event.target.closest('.picker')) openPicker(false); });
$('reload').addEventListener('click', async () => { await loadSessions(); showCurrent(); loadGraph(true); });
$('fit').addEventListener('click', () => cy?.fit(undefined, 40));
$('live').addEventListener('change', () => {
  clearInterval(liveTimer);
  if ($('live').checked) liveTimer = setInterval(() => loadGraph(true), 3000);
});
// A node named in the panel opens like a tap on it.
$('panel').addEventListener('click', event => {
  const target = event.target.closest('[data-seq]');
  if (!target || !cy) return;
  const seq = Number(target.dataset.seq);
  const node = cy.$id(`n${seq}`);
  if (node.length) { select(node); cy.animate({ center: { eles: node }, duration: 250 }); }
  show(seq);
});

// The panel's width follows the splitter and is kept for the next visit.
(() => {
  const panel = $('panel'), splitter = $('splitter');
  try { const saved = Number(localStorage.getItem('panelWidth')); if (saved) panel.style.width = `${saved}px`; } catch {}
  splitter.addEventListener('pointerdown', event => {
    splitter.setPointerCapture(event.pointerId);
    splitter.classList.add('dragging');
  });
  splitter.addEventListener('pointermove', event => {
    if (!splitter.classList.contains('dragging')) return;
    const right = document.querySelector('main').getBoundingClientRect().right;
    panel.style.width = `${Math.max(300, Math.min(right - event.clientX, innerWidth - 240))}px`;
    cy?.resize();
  });
  splitter.addEventListener('pointerup', () => {
    splitter.classList.remove('dragging');
    try { localStorage.setItem('panelWidth', String(panel.offsetWidth)); } catch {}
  });
})();

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => lastData && render(lastData, true));

loadSessions().then(session => { current = session; showCurrent(); loadGraph(false); })
  .catch(error => { $('status').innerHTML = `<span class="error">${escape(error.message)}</span>`; });
</script>
</body>
</html>
