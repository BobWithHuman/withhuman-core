<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WithHuman Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #d9dde4; --accent: #2f6fde;
    --group-bg: #eceff4; --group-border: #d3d9e2; --node-bg: #ffffff;
    --request: #4c7be0; --intent: #2bb3c0; --message: #8a63d2; --call: #9aa3b1; --other: #8b93a1;
    --allow: #2f9e5b; --deny: #d64545; --review: #d9a21b;
    --flow: #aab2bf; --cause: #e0433b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa3b1; --line: #2e343e;
      --group-bg: #1d2129; --group-border: #313844; --node-bg: #252a33; --flow: #5d6675; --call: #6b7484;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg);
         color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 6px 0 0; }
  select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 4px 8px; }
  select { max-width: 380px; }
  button { cursor: pointer; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: var(--panel); padding: 5px 12px; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); white-space: nowrap; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .status { color: var(--muted); margin-left: auto; }
  .error { color: var(--deny); }
  main { flex: 1; display: flex; min-height: 0; }
  #graph { flex: 1; min-width: 0; }
  aside { width: 400px; max-width: 42vw; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px; }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .empty { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  td { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 34%; white-space: nowrap; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .para { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .para.hidden { border-color: var(--deny); }
  .para small { color: var(--muted); display: block; margin-bottom: 2px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    aside { width: auto; max-width: none; height: 45vh; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>WithHuman Graph</h1>
  <select id="session" aria-label="세션"></select>
  <span class="tabs" role="group" aria-label="보기">
    <button type="button" data-view="flow" aria-pressed="true">그래프</button>
    <button type="button" data-view="tree" aria-pressed="false">원인 트리</button>
  </span>
  <button id="reload" type="button">새로고침</button>
  <button id="fit" type="button">전체 보기</button>
  <label><input id="live" type="checkbox"> 자동 갱신(3초)</label>
  <span class="legend">
    <span><i style="background:var(--request)"></i>요청</span>
    <span><i style="background:var(--intent)"></i>의도</span>
    <span><i style="background:var(--message)"></i>메시지</span>
    <span><i style="background:var(--allow)"></i>ALLOW</span>
    <span><i style="background:var(--deny)"></i>DENY</span>
    <span><i style="background:var(--cause)"></i>원인</span>
  </span>
  <span class="status" id="status"></span>
</header>
<main>
  <div id="graph"></div>
  <aside id="panel"><p class="empty">노드를 누르면 여기에 속성이 나옵니다. Call을 누르면 그 Call의 원인선이 강조됩니다.</p></aside>
</main>
<script>
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const KIND_COLOR = { Request: '--request', Intent: '--intent', Message: '--message', Call: '--call' };
const DECISION_COLOR = { ALLOW: '--allow', DENY: '--deny', REVIEW: '--review' };
const ICON = { Request: '👤', Intent: '🎯', Message: '💬', ConfigChange: '⚙', SubagentStart: '⤵', SubagentStop: '⤴' };
const LEAD = new Set(['Request', 'Intent', 'Message']);
const RESULT = new Set(['Segment', 'Error']);
const HIDDEN = new Set(['ToolBatch', 'ToolDescriptions']);
const $ = id => document.getElementById(id);
let cy, current = null, liveTimer = null, lastData = null, lastSignature = '', model = null, view = 'flow';

function parse(json) {
  if (typeof json !== 'string') return null;
  try { return JSON.parse(json); } catch { return null; }
}
const flat = text => String(text ?? '').replace(/\s+/g, ' ').trim();
const clip = (text, n) => { const f = flat(text); return f.length > n ? f.slice(0, n) + '…' : f; };
const time = ms => ms ? new Date(ms).toLocaleString() : '';
const percent = p => typeof p === 'number' ? p.toFixed(2).replace(/\.?0+$/, '') : '';
function escape(text) {
  return String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// A tool result is drawn as its Call and a ToolBatch as what came before it, so every edge
// lands on a node that is on screen.
function build(data) {
  const bySeq = new Map(data.nodes.map(node => [node.props.seq, node]));
  const callOf = new Map(), resultOf = new Map(), previous = new Map();
  for (const e of data.edges) {
    if (e.type === 'RESULT_OF' && bySeq.has(e.target)) callOf.set(e.source, e.target);
    if (e.type === 'NEXT' && e.props.kind !== 'cause') previous.set(e.target, e.source);
  }
  for (const [result, call] of callOf) if (!resultOf.has(call)) resultOf.set(call, bySeq.get(result));
  const shown = node => !HIDDEN.has(node.kind) && !(RESULT.has(node.kind) && callOf.has(node.props.seq));
  const rep = (seq, depth = 0) => {
    const node = bySeq.get(seq);
    if (!node || depth > 50) return null;
    if (callOf.has(seq)) return callOf.get(seq);
    if (shown(node)) return seq;
    return previous.has(seq) ? rep(previous.get(seq), depth + 1) : null;
  };
  const flows = new Map();
  for (const e of data.edges) {
    if (e.type !== 'NEXT' || e.props.kind === 'cause') continue;
    const a = rep(e.source), b = rep(e.target);
    if (a != null && b != null && a !== b) flows.set(`${a}-${b}`, { from: a, to: b });
  }
  const causes = data.edges.filter(e => e.props.kind === 'cause')
    .map(e => ({ from: rep(e.source), to: rep(e.target), via: e.target, props: e.props }))
    .filter(c => c.from != null && c.to != null && c.from !== c.to);
  const groupOf = new Map();
  data.subgraphs.forEach(s => s.members.forEach(seq => groupOf.set(seq, s.props.number)));
  const nodes = data.nodes.filter(shown);
  const subgraphParent = new Map(data.subgraphs.map(s => [s.props.number, s.props.parent]));
  return { bySeq, resultOf, groupOf, subgraphParent, nodes, flows: [...flows.values()], causes };
}

function label(node) {
  const s = node.summary || {};
  switch (node.kind) {
    case 'Request': return `${ICON.Request} ${clip(s.prompt, 26)}`;
    case 'Intent': return `${ICON.Intent} ${clip(s.intent, 26)}`;
    case 'Message': return `${ICON.Message} ${clip(s.text, 26)}`;
    case 'Call': {
      const result = model.resultOf.get(node.props.seq);
      const mark = !result ? ' …' : result.kind === 'Error' ? ' ✗' : ' ✓';
      return `${clip(`${s.tool_name || 'Call'} ${s.brief || ''}`, 26)}${mark}`;
    }
    case 'ConfigChange': return `${ICON.ConfigChange} ${clip(s.file_path, 24)}`;
    default: return `${ICON[node.kind] || ''} ${node.kind}`;
  }
}

function nodeData(node, parent) {
  const decision = node.props.decision;
  const color = css(KIND_COLOR[node.kind] || '--other');
  return {
    id: `n${node.props.seq}`, parent, seq: node.props.seq, kind: node.kind, label: label(node),
    fill: LEAD.has(node.kind) ? color : css('--node-bg'),
    border: decision ? css(DECISION_COLOR[decision] || '--other') : color,
    borderWidth: decision ? 3 : 1.5, lead: LEAD.has(node.kind),
  };
}

// The flow view: each SubGraph a shaded area, its prompt, intent or message on the left and its
// Calls fanned out to the right; areas run left to right.
function flowElements() {
  const elements = [], groups = new Map();
  for (const node of model.nodes) {
    const number = model.groupOf.get(node.props.seq);
    const key = number === undefined ? 'loose' : number;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(node);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === 'loose') - (b === 'loose') || a - b);
  const W = 190, H = 54, GAP = 90;
  let x = 0;
  for (const key of keys) {
    const members = groups.get(key).sort((a, b) => a.props.order - b.props.order);
    const leads = members.filter(n => LEAD.has(n.kind));
    const rest = members.filter(n => !LEAD.has(n.kind));
    const parent = `g${key}`;
    elements.push({ group: 'nodes', data: { id: parent, area: true, label: key === 'loose' ? '서브그래프 없음' : `S${key}` } });
    const leadHeight = leads.length * H, restHeight = rest.length * H;
    const top = -Math.max(leadHeight, restHeight) / 2;
    leads.forEach((node, i) => elements.push({ group: 'nodes', data: nodeData(node, parent),
      position: { x, y: top + (Math.max(restHeight, leadHeight) - leadHeight) / 2 + i * H } }));
    const restX = leads.length ? x + W + 40 : x;
    rest.forEach((node, i) => elements.push({ group: 'nodes', data: nodeData(node, parent),
      position: { x: restX, y: top + (Math.max(restHeight, leadHeight) - restHeight) / 2 + i * H } }));
    x = (rest.length ? restX : x) + W + GAP;
  }
  for (const f of model.flows) elements.push({ group: 'edges', data: { id: `f${f.from}-${f.to}`, source: `n${f.from}`, target: `n${f.to}`, flow: true } });
  for (const c of model.causes) elements.push({ group: 'edges', data: {
    id: `c${c.from}-${c.via}`, source: `n${c.from}`, target: `n${c.to}`, cause: true, label: percent(c.props.probability), props: c.props } });
  return { elements, layout: { name: 'preset' } };
}

// The cause tree: SubGraphs as areas, each under the SubGraph its Calls were traced to (its
// `parent`), prompts on top. Cause edges run from each Call up to its cause in the parent area.
function treeElements() {
  const W = 190, H = 46, GAP_X = 50, GAP_Y = 90, PAD = 40;
  const members = new Map();
  for (const node of model.nodes) {
    const number = model.groupOf.get(node.props.seq);
    if (number === undefined) continue;
    if (!members.has(number)) members.set(number, []);
    members.get(number).push(node);
  }
  for (const list of members.values()) {
    list.sort((a, b) => (LEAD.has(b.kind) - LEAD.has(a.kind)) || a.props.order - b.props.order);
  }
  const numbers = [...members.keys()].sort((a, b) => a - b);
  const parentOf = new Map();
  for (const number of numbers) {
    const key = model.subgraphParent.get(number);
    const parent = /^s\d+$/.test(key || '') ? Number(key.slice(1)) : null;
    if (parent !== null && parent !== number && members.has(parent)) parentOf.set(number, parent);
  }
  const children = new Map(numbers.map(n => [n, []]));
  for (const [child, parent] of parentOf) children.get(parent).push(child);
  const roots = numbers.filter(n => !parentOf.has(n));

  // Each subtree is as wide as its children side by side, or its own area.
  const width = new Map();
  const measure = (n, seen = new Set()) => {
    if (seen.has(n)) return W;
    seen.add(n);
    const kids = children.get(n).reduce((sum, c) => sum + measure(c, seen) + GAP_X, -GAP_X);
    width.set(n, Math.max(W, kids));
    return width.get(n);
  };
  roots.forEach(n => measure(n));
  const depth = new Map(), center = new Map();
  const place = (n, left, level, seen = new Set()) => {
    if (seen.has(n)) return;
    seen.add(n);
    depth.set(n, level);
    center.set(n, left + width.get(n) / 2);
    let x = left + (width.get(n) - children.get(n).reduce((s, c) => s + width.get(c) + GAP_X, -GAP_X)) / 2;
    for (const c of children.get(n)) { place(c, x, level + 1, seen); x += width.get(c) + GAP_X; }
  };
  let x = 0;
  for (const root of roots) { place(root, x, 0); x += width.get(root) + GAP_X * 2; }
  const levelHeight = [];
  for (const n of numbers) {
    const d = depth.get(n) ?? 0;
    levelHeight[d] = Math.max(levelHeight[d] || 0, members.get(n).length * H);
  }
  const levelTop = [];
  levelHeight.forEach((h, d) => { levelTop[d] = d === 0 ? 0 : levelTop[d - 1] + levelHeight[d - 1] + GAP_Y + PAD; });

  const elements = [];
  for (const n of numbers) {
    const parent = `g${n}`;
    elements.push({ group: 'nodes', data: { id: parent, area: true, label: `S${n}` } });
    members.get(n).forEach((node, i) => elements.push({ group: 'nodes', data: nodeData(node, parent),
      position: { x: center.get(n) ?? 0, y: (levelTop[depth.get(n) ?? 0] || 0) + i * H } }));
  }
  for (const c of model.causes) {
    if (!model.groupOf.has(c.from) || !model.groupOf.has(c.to)) continue;
    elements.push({ group: 'edges', data: {
      id: `c${c.from}-${c.via}`, source: `n${c.from}`, target: `n${c.to}`, cause: true,
      label: percent(c.props.probability), props: c.props } });
  }
  return { elements, layout: { name: 'preset' } };
}

function style() {
  return [
    { selector: 'node', style: {
      shape: 'round-rectangle', width: 172, height: 36, 'background-color': 'data(fill)', 'background-opacity': 1,
      'border-color': 'data(border)', 'border-width': 'data(borderWidth)', label: 'data(label)',
      'text-valign': 'center', 'text-halign': 'center', 'text-wrap': 'ellipsis', 'text-max-width': 160,
      'font-size': 11, color: css('--text'),
    }},
    { selector: 'node[?lead]', style: { 'background-opacity': 0.14, shape: 'round-rectangle', 'corner-radius': 18 } },
    { selector: 'node[?area]', style: {
      shape: 'round-rectangle', 'background-color': css('--group-bg'), 'background-opacity': 1,
      'border-color': css('--group-border'), 'border-width': 1, label: 'data(label)', 'text-valign': 'top',
      'text-halign': 'center', 'font-size': 12, 'font-weight': 700, color: css('--muted'), padding: 18, 'text-margin-y': -6,
    }},
    { selector: 'edge', style: {
      width: 1.3, 'line-color': css('--flow'), 'target-arrow-color': css('--flow'), 'target-arrow-shape': 'triangle',
      'arrow-scale': 0.7, 'curve-style': 'bezier',
    }},
    { selector: 'edge[?cause]', style: {
      width: 2, 'line-style': 'dashed', 'line-color': css('--cause'), 'target-arrow-color': css('--cause'),
      'curve-style': 'unbundled-bezier', 'control-point-distances': 40, label: 'data(label)', 'font-size': 10,
      'font-weight': 700, color: css('--cause'), 'text-background-color': css('--bg'), 'text-background-opacity': 1,
      'text-background-padding': 2, 'text-background-shape': 'round-rectangle',
    }},
    { selector: '.faded', style: { opacity: 0.12 } },
    { selector: 'edge.focus', style: { width: 3, opacity: 1 } },
    { selector: 'node:selected', style: { 'overlay-color': css('--accent'), 'overlay-opacity': 0.18, 'overlay-padding': 5 } },
  ];
}

function render(data, keepView) {
  model = build(data);
  const saved = keepView && cy ? { zoom: cy.zoom(), pan: cy.pan(), selected: cy.$('node:selected').id() } : null;
  cy?.destroy();
  const { elements, layout } = view === 'flow' ? flowElements() : treeElements();
  cy = cytoscape({ container: $('graph'), elements, style: style(), layout,
    wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 3, autoungrabify: false });
  if (saved) { cy.zoom(saved.zoom); cy.pan(saved.pan); if (saved.selected) select(cy.$id(saved.selected)); }
  else cy.fit(undefined, 40);
  cy.on('tap', 'node[seq]', event => { select(event.target); show(event.target.data('seq')); });
  cy.on('tap', event => { if (event.target === cy) select(null); });
}

// Selecting a Call fades everything but it, its causes and their edges.
function select(node) {
  cy.elements().removeClass('faded focus');
  cy.$(':selected').unselect();
  if (!node || !node.length) return;
  node.select();
  const causes = node.outgoers('edge[?cause]');
  if (!causes.length) return;
  cy.elements().not(node).not(causes).not(causes.targets()).not('node[?area]').addClass('faded');
  causes.addClass('focus');
}

const row = (key, value) => {
  const parsed = /_json$/.test(key) ? parse(value) : null;
  const shown = parsed !== null ? `<pre>${escape(JSON.stringify(parsed, null, 2))}</pre>`
    : /(_at|^observed_at)$/.test(key) && typeof value === 'number' ? `${value} <span class="empty">(${time(value)})</span>`
    : typeof value === 'object' ? `<pre>${escape(JSON.stringify(value, null, 2))}</pre>`
    : escape(String(value));
  return `<tr><td>${escape(key)}</td><td>${shown}</td></tr>`;
};
const table = props => `<table>${Object.keys(props).sort().map(k => row(k, props[k])).join('')}</table>`;

function causesHtml(seq) {
  const causes = model.causes.filter(c => c.from === seq);
  if (!causes.length) return '';
  const rows = causes.map(c => {
    const target = model.bySeq.get(c.via);
    const s = target?.summary || {};
    const what = target ? `#${c.via} ${target.kind} ${flat(s.tool_name || s.prompt || s.text || '')}` : `#${c.via}`;
    return `<tr><td>p=${percent(c.props.probability)}</td><td>${escape(what.slice(0, 120))}</td></tr>`;
  }).join('');
  return `<h3>원인</h3><table>${rows}</table>`;
}

let shownSeq = null;
async function show(seq) {
  const node = model.bySeq.get(seq);
  if (!node) return;
  shownSeq = seq;
  const props = node.props;
  const trace = parse(props.trace_json);
  const result = model.resultOf.get(seq);
  const decision = props.decision
    ? `<p><span class="badge" style="background:${css(DECISION_COLOR[props.decision] || '--other')}">${escape(props.decision)}</span> ${escape(props.decision_rule || '')} ${props.intent_score != null ? '· score ' + percent(props.intent_score) : ''}</p>
       ${props.decision_reason ? `<p>${escape(props.decision_reason)}</p>` : ''}
       ${causesHtml(seq)}
       ${trace?.intents ? `<h3>의도 (${escape(trace.intent_source || '')})</h3><p>${escape(trace.intents)}</p>` : ''}`
    : props.trace_error ? `<p class="error">판정 실패: ${escape(props.trace_error)}</p>` : '';
  const resultLink = result ? `<p><button type="button" id="open-result">결과 #${result.props.seq} ${escape(result.kind)} 보기</button></p>` : '';
  const head = `<h2>#${props.seq} ${escape(node.kind)}</h2>${decision}${resultLink}`;
  const panel = $('panel');
  panel.innerHTML = `${head}<h3>속성</h3>${table(props)}<h3>문단 · 토큰</h3><p class="empty">불러오는 중…</p>`;
  const bind = () => $('open-result')?.addEventListener('click', () => show(result.props.seq));
  bind();
  try {
    const detail = await api(`/api/node?session=${encodeURIComponent(current)}&seq=${props.seq}`);
    if (shownSeq !== seq) return;
    const paragraphs = (detail?.paragraphs || []).map(p =>
      `<div class="para${p.hidden ? ' hidden' : ''}"><small>#${p.index} · ${escape(p.source || '')}${p.hidden ? ' · hidden ' + escape(JSON.stringify(p.hidden_rules)) : ''}${p.instructs != null ? ' · instructs ' + p.instructs : ''}</small><pre>${escape(p.text || '')}</pre></div>`).join('');
    const tokens = (detail?.tokens || []).map(t =>
      `<tr><td>${escape(t.kind)} · ${escape(t.slot)}</td><td>${escape(String(t.decoded ?? ''))} <span class="empty">${escape(t.category || '')}</span></td></tr>`).join('');
    panel.innerHTML = `${head}<h3>속성</h3>${table(detail?.props || props)}
      <h3>토큰 (${detail?.tokens?.length || 0})</h3>${tokens ? `<table>${tokens}</table>` : '<p class="empty">없음</p>'}
      <h3>문단 (${detail?.paragraphs?.length || 0})</h3>${paragraphs || '<p class="empty">없음</p>'}`;
    bind();
  } catch (error) {
    panel.insertAdjacentHTML('beforeend', `<p class="error">${escape(error.message)}</p>`);
  }
}

async function api(path) {
  const response = await fetch(path);
  const body = await response.json();
  if (!response.ok) throw new Error(body?.error || response.statusText);
  return body;
}

async function loadSessions() {
  const sessions = await api('/api/sessions');
  const wanted = decodeURIComponent(location.hash.slice(1)) || current;
  $('session').innerHTML = sessions.map(s =>
    `<option value="${escape(s.id)}">${escape(time(s.created_at))} · ${escape(s.id)} (${s.nodes})</option>`).join('');
  if (wanted && sessions.some(s => s.id === wanted)) $('session').value = wanted;
  return $('session').value;
}

async function loadGraph(keepView) {
  if (!current) return;
  $('status').textContent = '불러오는 중…';
  try {
    const data = await api(`/api/graph?session=${encodeURIComponent(current)}`);
    const signature = JSON.stringify(data);
    if (!keepView || signature !== lastSignature) render(data, keepView);
    lastData = data;
    lastSignature = signature;
    $('status').textContent = `노드 ${data.nodes.length} · 서브그래프 ${data.subgraphs.length} · ${new Date().toLocaleTimeString()}`;
  } catch (error) {
    $('status').innerHTML = `<span class="error">${escape(error.message)}</span>`;
  }
}

document.querySelectorAll('.tabs button').forEach(button => button.addEventListener('click', () => {
  view = button.dataset.view;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  if (lastData) render(lastData, false);
}));
$('session').addEventListener('change', () => {
  current = $('session').value; location.hash = encodeURIComponent(current); lastSignature = '';
  $('panel').innerHTML = '<p class="empty">노드를 누르면 여기에 속성이 나옵니다. Call을 누르면 그 Call의 원인선이 강조됩니다.</p>';
  loadGraph(false);
});
$('reload').addEventListener('click', async () => { await loadSessions(); loadGraph(true); });
$('fit').addEventListener('click', () => cy?.fit(undefined, 40));
$('live').addEventListener('change', () => {
  clearInterval(liveTimer);
  if ($('live').checked) liveTimer = setInterval(() => loadGraph(true), 3000);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => lastData && render(lastData, true));

loadSessions().then(session => { current = session; loadGraph(false); })
  .catch(error => { $('status').innerHTML = `<span class="error">${escape(error.message)}</span>`; });
</script>
</body>
</html>
