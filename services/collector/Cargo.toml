[package]
name = "withhuman-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.13", default-features = false, features = ["router", "transport"] }
withhuman-contracts = { version = "0.1.0", path = "../../crates/contracts" }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
