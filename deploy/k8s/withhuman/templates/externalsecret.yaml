{{- if .Values.externalSecret.enabled -}}
{{- $context := dict "root" $ "component" "secret" -}}
# Builds the engine Secret from the cluster store. Retain it while Helm recreates this hook.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "withhuman.fullname" . }}
  labels:
    {{- include "withhuman.labels" $context | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- required "externalSecret.data is required" .Values.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
