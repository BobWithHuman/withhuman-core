{{- if .Values.externalSecret.enabled -}}
{{- $context := dict "root" $ "component" "secret" -}}
# Builds `existingSecret` from the cluster's secret store. It runs before the schema Job, which
# reads the Neo4j password. The Secret outlives the ExternalSecret, which each release recreates,
# so running Pods never lose it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "withhuman.fullname" . }}
  labels:
    {{- include "withhuman.labels" $context | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- required "externalSecret.data is required" .Values.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
