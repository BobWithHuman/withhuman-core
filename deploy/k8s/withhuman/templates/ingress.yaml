{{- if .Values.ingress.enabled -}}
{{- $context := dict "root" $ "component" "agentgateway" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "withhuman.fullname" . }}
  labels:
    {{- include "withhuman.labels" $context | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "withhuman.fullname" . }}-agentgateway
                port:
                  name: http
{{- end }}
