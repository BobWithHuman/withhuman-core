{{- if .Values.schema.enabled -}}
{{- $context := dict "root" $ "component" "schema" -}}
{{- $name := printf "%s-schema" (include "withhuman.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "withhuman.labels" $context | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  schema.cypher: |
    {{- .Files.Get "files/schema.cypher" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "withhuman.labels" $context | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        {{- include "withhuman.selectorLabels" $context | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: {{ .Values.schema.image | quote }}
          command:
            - cypher-shell
            - --address
            - {{ required "neo4j.boltUrl is required" .Values.neo4j.boltUrl | quote }}
            - --username
            - {{ .Values.neo4j.user | quote }}
            - --non-interactive
            - --file
            - /bootstrap/schema.cypher
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: neo4j-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: schema
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: {{ $name }}
{{- end }}
