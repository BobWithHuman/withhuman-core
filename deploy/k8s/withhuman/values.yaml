# Commit SHA of the images to run, shared by every service so a release names one build.
imageTag: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# The Secret holds the keys `database-url`, `jev-api-key` and `redis-url`. Create it outside the
# chart, or have `externalSecret` build it from the cluster's secret store.
existingSecret: withhuman

externalSecret:
  enabled: false
  # ClusterSecretStore set up with the cluster (infra/modules/platform).
  storeName: cloud-secrets
  refreshInterval: 1h
  # External Secrets `data` entries: each Secret key and where it comes from.
  data: []

# PostgreSQL runs outside the cluster. The DSN is read from the Secret above.
postgres:
  poolSize: 16

collector:
  image: ghcr.io/bobwithhuman/withhuman-collector
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  mode: shadow # record, shadow or enforce
  onFailure: closed # open or closed
  ask: ask # deny or ask
  decisionTimeoutMs: 4200
  intentCapture: "on" # on or off
  # `hook` applies verdicts on MCP tools at the PreToolUse Hook, so a tool that does not pass
  # through AgentGateway is enforced too.
  mcpEnforce: hook
  # `on` refuses Hooks without a valid per-user key (a PreToolUse is denied); `off` takes them
  # without a user. The key administration API needs `admin-token` in the Secret.
  requireKey: "off"

generator:
  image: ghcr.io/bobwithhuman/withhuman-generator
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  # The company's device list from its EDR, a Wazuh manager. Off while `url` is empty; with a
  # URL, `user` and the Secret's `wazuh-password` are required. One replica syncs at a time.
  wazuh:
    url: "" # the server API, such as https://wazuh.example.com:55000
    user: "" # an API user with the role `readonly`
    syncIntervalSecs: 120
    # Kept under the manager's own limit (300 by default); 0 sends without pacing.
    maxRequestsPerMinute: 150
    # Verify the manager against the Secret's `wazuh-ca` alone: a PEM of its authority, or of
    # its own self-signed certificate.
    caFromSecret: false
    # Skip verifying the manager's certificate. Not with `caFromSecret`.
    tlsSkipVerify: false

decision:
  image: ghcr.io/bobwithhuman/withhuman-decision
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  environment: production # development, test or production
  provider: jev # jev or mock
  jevUrl: https://api.typesafe.ai
  jevTimeoutMs: 3000
  intentBlockThreshold: 0.5
  # A call the engine would allow, caused by a result from a source the security team distrusts
  # (`POST /v1/admin/sources/distrust`), is held for review; `true` denies it instead.
  distrustedSourceDeny: false

# Claude Code's model requests through the gateway (ANTHROPIC_BASE_URL to the Ingress host):
# checked against the users' keys and session stops, recorded without content in model_calls,
# with tokens from the gateway's request log, which it keeps in the engine's PostgreSQL.
modelProxy:
  enabled: false

agentgateway:
  image: cr.agentgateway.dev/agentgateway:v1.7.0
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  # MCP servers served through the gateway, as `{name, url}`. Their tool calls pass the extAuthz
  # check. Left empty, the gateway serves Hooks only.
  mcpTargets: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  # Secret holding the host's TLS certificate; set to serve HTTPS, such as one cert-manager issues.
  tlsSecretName: ""

# Time for load balancers to stop sending a terminating Pod new requests.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# Lets only the service that calls an engine service reach it. Needs a CNI that enforces them.
networkPolicy:
  enabled: true
