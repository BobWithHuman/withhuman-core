# Fill in `neo4j` and `ingress.host` when the staging environment exists.
neo4j:
  httpUrl: ""
  boltUrl: ""

collector:
  mode: shadow

ingress:
  enabled: true
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
