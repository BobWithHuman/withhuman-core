name: withhuman-core

services:
  neo4j:
    image: neo4j:5.26.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/docker/.env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./neo4j:/bootstrap:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell --address bolt://localhost:7687 --username neo4j
          --password "$${NEO4J_AUTH#*/}" 'RETURN 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - engine

volumes:
  neo4j-data:
  neo4j-logs:

networks:
  engine:
    name: withhuman-engine
