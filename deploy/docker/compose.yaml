name: withhuman-core

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: withhuman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-withhuman-e2e}
      POSTGRES_DB: withhuman
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "withhuman", "-d", "withhuman"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  # Shared Collector state (session orders, verdicts) so the Collector can run several
  # replicas. Append-only persistence keeps session orders across a Redis restart.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  decision:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: withhuman-decision
    # Jev's key and settings on a deployment; CI and the E2E suite run without it.
    env_file:
      - path: .env
        required: false
    environment:
      DECISION_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://withhuman:${POSTGRES_PASSWORD:-withhuman-e2e}@postgres:5432/withhuman
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-16}
      WITHHUMAN_ENV: ${WITHHUMAN_ENV:-production}
      # `jev` traces each Call's cause through Jev and denies calls that depart from the
      # stated intent; the E2E suite runs `mock`, which answers MOCK_DECISION, in the test
      # environment.
      DECISION_PROVIDER: ${DECISION_PROVIDER:-jev}
      MOCK_DECISION: ${MOCK_DECISION:-ALLOW}
      MOCK_DECISION_REASON: ${MOCK_DECISION_REASON:-}
      MOCK_DECISION_DELAY_MS: ${MOCK_DECISION_DELAY_MS:-0}
      JEV_URL: ${JEV_URL:-https://api.typesafe.ai}
      JEV_TIMEOUT_MS: ${JEV_TIMEOUT_MS:-3000}
      # Deviations at which a Call is denied or reviewed; the untrusted pair applies to a Call
      # that follows from a tool result or from nothing.
      WITHHUMAN_DEVIATION_DENY: ${WITHHUMAN_DEVIATION_DENY:-0.3}
      WITHHUMAN_DEVIATION_REVIEW: ${WITHHUMAN_DEVIATION_REVIEW:-0.15}
      WITHHUMAN_UNTRUSTED_DEVIATION_DENY: ${WITHHUMAN_UNTRUSTED_DEVIATION_DENY:-0.3}
      WITHHUMAN_UNTRUSTED_DEVIATION_REVIEW: ${WITHHUMAN_UNTRUSTED_DEVIATION_REVIEW:-0.15}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  generator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: withhuman-generator
    environment:
      GENERATOR_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://withhuman:${POSTGRES_PASSWORD:-withhuman-e2e}@postgres:5432/withhuman
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-16}
      DECISION_URL: http://decision:8082
    depends_on:
      postgres:
        condition: service_healthy
      decision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  collector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: withhuman-collector
    environment:
      COLLECTOR_ADDR: 0.0.0.0:8080
      COLLECTOR_EXT_AUTHZ_ADDR: 0.0.0.0:9000
      GENERATOR_URL: http://generator:8081
      REDIS_URL: redis://redis:6379
      WITHHUMAN_MODE: ${WITHHUMAN_MODE:-enforce}
      WITHHUMAN_ON_FAILURE: ${WITHHUMAN_ON_FAILURE:-closed}
      WITHHUMAN_ASK: ${WITHHUMAN_ASK:-ask}
      WITHHUMAN_DECISION_TIMEOUT_MS: ${WITHHUMAN_DECISION_TIMEOUT_MS:-4200}
      # `off` skips waiting for and asking for a turn's intent, as the E2E suite does.
      WITHHUMAN_INTENT_CAPTURE: ${WITHHUMAN_INTENT_CAPTURE:-on}
      WITHHUMAN_REQUIRE_KEY: ${WITHHUMAN_REQUIRE_KEY:-off}
      WITHHUMAN_ADMIN_TOKEN: ${WITHHUMAN_ADMIN_TOKEN:-}
    depends_on:
      generator:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  mcp-fixture:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: withhuman-mcp-fixture
    environment:
      MCP_FIXTURE_ADDR: 0.0.0.0:8090
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    command: ["-f", "/config.yaml"]
    ports:
      - "127.0.0.1:${AGENTGATEWAY_PORT:-3000}:3000"
    volumes:
      - ./agentgateway/config.yaml:/config.yaml:ro
    depends_on:
      collector:
        condition: service_healthy
      mcp-fixture:
        condition: service_healthy
    networks: [engine]

volumes:
  postgres-data:
  redis-data:

networks:
  engine:
    name: ${WITHHUMAN_ENGINE_NETWORK:-withhuman-engine}
