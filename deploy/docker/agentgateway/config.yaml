# yaml-language-server: $schema=https://agentgateway.dev/schema/config

gateways:
  default:
    port: 3000

routes:
  # Same two routes as deploy/agentgateway/config.yaml, so a health check written against
  # one profile answers on the other.
  - name: health
    matches:
      - path:
          pathPrefix: /healthz
    backends:
      - host: collector:8080
  - name: claude-hooks
    matches:
      - path:
          pathPrefix: /v1/hooks
    backends:
      - host: collector:8080
  # Device registration and the key administration API (WITHHUMAN_ADMIN_TOKEN).
  - name: inventory
    matches:
      - path:
          pathPrefix: /v1/clients
      - path:
          pathPrefix: /v1/admin
    backends:
      - host: collector:8080

mcp:
  policies:
    extAuthz:
      conditional:
        - condition: has(mcp.tool)
          host: collector:9000
          protocol:
            grpc: {}
          failureMode: deny
          includeRequestBody:
            maxRequestBytes: 1048576
            allowPartialMessage: false
            packAsBytes: true
  targets:
    - name: fixture
      mcp:
        host: http://mcp-fixture:8090/mcp
