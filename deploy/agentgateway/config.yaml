# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The gateway configuration the root compose.yaml mounts.
#
# Hooks only, which is what the chart's default `mcpTargets: []` renders too. Add an entry under
# `mcp.targets` to serve an MCP server through the gateway; its tool calls then pass the extAuthz
# check against the Collector.

gateways:
  default:
    port: 3000

routes:
  - name: health
    matches:
      - path:
          pathPrefix: /healthz
    backends:
      - host: collector:8080
  - name: claude-hooks
    matches:
      - path:
          pathPrefix: /v1/hooks
    backends:
      - host: collector:8080
  # Device registration and the key administration API (WITHHUMAN_ADMIN_TOKEN).
  - name: inventory
    matches:
      - path:
          pathPrefix: /v1/clients
      - path:
          pathPrefix: /v1/admin
    backends:
      - host: collector:8080

mcp:
  policies:
    extAuthz:
      conditional:
        - condition: has(mcp.tool)
          host: collector:9000
          protocol:
            grpc: {}
          failureMode: deny
          includeRequestBody:
            maxRequestBytes: 1048576
            allowPartialMessage: false
            packAsBytes: true
  targets: []
