name: Basic CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Keep formatting and lint checks separate so failures are easy to identify.
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  nextest:
    name: Nextest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: withhuman
          POSTGRES_PASSWORD: withhuman-integration
          POSTGRES_DB: withhuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U withhuman -d withhuman"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        env:
          POSTGRES_INTEGRATION_URL: postgres://withhuman:withhuman-integration@127.0.0.1:5432/withhuman
          REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
        run: cargo nextest run --no-tests=pass --test-threads=1

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/k8s/withhuman
      CHART_VALUES: >-
        --set imageTag=ci
        --set ingress.host=withhuman.test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render personal Compose profile
        run: docker compose --env-file .env.example config --quiet

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint "$CHART" $CHART_VALUES

      - name: Render chart
        run: |
          helm template withhuman "$CHART" $CHART_VALUES --set ingress.enabled=true >/dev/null
          helm template withhuman "$CHART" $CHART_VALUES --set externalSecret.enabled=true \
            --set 'externalSecret.data[0].secretKey=k' --set 'externalSecret.data[0].remoteRef.key=k' >/dev/null

      - name: Lint platform chart
        run: |
          helm lint infra/modules/platform/chart \
            --set secretStore.provider.fake.data[0].key=k --set certificates.email=ops@example.com \
            --set gitops.url=git@example.com:r.git --set gitops.secretKey=k --set gitops.include=staging.yaml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -recursive -check infra

      - name: Validate every root
        run: |
          for root in infra/modules/platform infra/aws/bootstrap infra/aws/staging; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
