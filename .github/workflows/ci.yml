name: Basic CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Each check runs only when the pull request touches what it checks: a README change starts
  # none of them, a client hook change only the client tests. A change to this file runs them all.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      deny: ${{ steps.areas.outputs.deny }}
      client: ${{ steps.areas.outputs.client }}
      deploy: ${{ steps.areas.outputs.deploy }}
      infra: ${{ steps.areas.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the changed areas
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          area() {
            if printf '%s\n' "$changed" | grep -qE "^\.github/workflows/ci\.yml$|$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # What the Rust workspace builds from (its members and the fixtures its tests read).
          area rust '^(Cargo\.(toml|lock)$|crates/|services/|tests/fixtures/)'
          area deny '(^|/)Cargo\.(toml|lock)$|^deny\.toml$'
          area client '^deploy/client/'
          area deploy '^(deploy/(k8s|docker|agentgateway)/|compose(\.override)?\.yaml$|\.env\.example$|infra/modules/platform/chart/)'
          area infra '^infra/'

  # Keep formatting and lint checks separate so failures are easy to identify.
  rustfmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        # `--all-features` builds withhuman-local with `bundled`, whose build script fetches
        # PostgreSQL's release list from GitHub's API: unauthenticated, the runners' shared
        # addresses run out of requests (403). The job's token raises the limit, and the version
        # is the one the personal app ships.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTGRESQL_VERSION: "=16.16.0"
        run: cargo clippy --all-targets --all-features -- -D warnings

  nextest:
    name: Nextest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: withhuman
          POSTGRES_PASSWORD: withhuman-integration
          POSTGRES_DB: withhuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U withhuman -d withhuman"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        env:
          POSTGRES_INTEGRATION_URL: postgres://withhuman:withhuman-integration@127.0.0.1:5432/withhuman
          REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
        run: cargo nextest run --no-tests=pass --test-threads=1

  client:
    name: Client hooks
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run the client tests
        # One suite per folder: each agent's tests are named `test_withhuman_hook.py`, which
        # one discovery run cannot import twice. The folders are found rather than listed, so
        # an agent added later is not left out quietly. The exit code of each has to reach the
        # shell, so nothing is piped.
        run: |
          set -e
          for suite in $(find deploy/client -name 'test_*.py' -exec dirname {} \; | sort -u); do
            echo "== $suite"
            (cd "$suite" && python -m unittest discover -p 'test_*.py')
          done

  helm:
    name: Helm Chart
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      CHART: deploy/k8s/withhuman
      CHART_VALUES: >-
        --set imageTag=ci
        --set ingress.host=withhuman.test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render personal Compose profile
        run: docker compose --env-file .env.example config --quiet

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint "$CHART" $CHART_VALUES

      - name: Render chart
        run: |
          helm template withhuman "$CHART" $CHART_VALUES --set ingress.enabled=true >/dev/null
          helm template withhuman "$CHART" $CHART_VALUES --set externalSecret.enabled=true \
            --set 'externalSecret.data[0].secretKey=k' --set 'externalSecret.data[0].remoteRef.key=k' >/dev/null

      - name: Lint platform chart
        run: |
          helm lint infra/modules/platform/chart \
            --set secretStore.provider.fake.data[0].key=k --set certificates.email=ops@example.com \
            --set gitops.url=git@example.com:r.git --set gitops.secretKey=k --set gitops.include=staging.yaml

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -recursive -check infra

      - name: Validate every root
        run: |
          for root in infra/modules/platform infra/aws/bootstrap infra/aws/staging; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  cargo-deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
