name: Basic CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Keep formatting and lint checks separate so failures are easy to identify.
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  nextest:
    name: Nextest
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/withhuman-integration
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        env:
          NEO4J_INTEGRATION_URL: http://127.0.0.1:7474
          NEO4J_INTEGRATION_USER: neo4j
          NEO4J_INTEGRATION_PASSWORD: withhuman-integration
        run: cargo nextest run --no-tests=pass

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
