name: Service Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/withhuman
  # Every image carries its full commit SHA; a version tag adds the version.
  IMAGE_TAGS: |
    type=sha,format=long,prefix=
    type=semver,pattern={{version}}

jobs:
  publish:
    name: Build and push service images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Dockerfile compiles every service before selecting one, so one job builds all the
    # images: the first compiles, and the others reuse its layers.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the Collector image
        id: collector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-collector
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push the Collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BINARY=withhuman-collector
          push: true
          tags: ${{ steps.collector.outputs.tags }}
          labels: ${{ steps.collector.outputs.labels }}
          cache-from: type=gha,scope=service-images
          cache-to: type=gha,scope=service-images,mode=max
          provenance: true
          sbom: true

      - name: Describe the Generator image
        id: generator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-generator
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push the Generator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BINARY=withhuman-generator
          push: true
          tags: ${{ steps.generator.outputs.tags }}
          labels: ${{ steps.generator.outputs.labels }}
          cache-from: type=gha,scope=service-images
          provenance: true
          sbom: true

      - name: Describe the Decision image
        id: decision
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-decision
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push the Decision image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BINARY=withhuman-decision
          push: true
          tags: ${{ steps.decision.outputs.tags }}
          labels: ${{ steps.decision.outputs.labels }}
          cache-from: type=gha,scope=service-images
          provenance: true
          sbom: true
