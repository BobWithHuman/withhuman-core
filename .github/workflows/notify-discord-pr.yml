name: Notify Discord of New Pull Request

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  notify:
    name: Send pull request notification
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Discord
        env:
          WEBHOOK_URL: ${{ secrets.PR_DISCORD_WEBHOOK }}
          ITEM_NUMBER: ${{ github.event.pull_request.number }}
          ITEM_TITLE: ${{ github.event.pull_request.title }}
          ITEM_AUTHOR: ${{ github.event.pull_request.user.login }}
          ITEM_BODY: ${{ github.event.pull_request.body }}
          ITEM_URL: ${{ github.event.pull_request.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PR_DISCORD_WEBHOOK is not configured"
            exit 1
          fi

          title="${ITEM_TITLE:0:180}"
          description="${ITEM_BODY:-No description provided.}"
          description="${description:0:500}"
          labels=$(jq -r '[.pull_request.labels[].name] | join(" · ")' "$GITHUB_EVENT_PATH")
          assignees=$(jq -r '[.pull_request.assignees[].login | "@" + .] | join(", ")' "$GITHUB_EVENT_PATH")
          reviewers=$(jq -r '[.pull_request.requested_reviewers[].login | "@" + .] | join(", ")' "$GITHUB_EVENT_PATH")

          details="👤 @$ITEM_AUTHOR"
          if [ -n "$labels" ]; then
            details+=$'\n'"🏷️ ${labels:0:200}"
          fi
          if [ -n "$assignees" ]; then
            details+=$'\n'"👥 Assignee: ${assignees:0:200}"
          fi
          if [ -n "$reviewers" ]; then
            details+=$'\n'"🔍 Reviewers: ${reviewers:0:200}"
          fi
          details+=$'\n'"🌿 ${HEAD_BRANCH} → ${BASE_BRANCH}"

          content=$(printf \
            '🔵 **New Pull Request**\n\n**#%s  %s**\n\n%s\n\n%s\n\n🔗 [View Pull Request](%s)' \
            "$ITEM_NUMBER" "$title" "$details" "$description" "$ITEM_URL")

          payload=$(jq -n \
            --arg content "$content" \
            '{
              username: "GitHub Notifications",
              allowed_mentions: {parse: []},
              content: $content
            }')

          curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$WEBHOOK_URL"
