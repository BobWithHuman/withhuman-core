name: Notify Discord of New Pull Request

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  notify:
    name: Send pull request notification
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Discord
        env:
          WEBHOOK_URL: ${{ secrets.PR_DISCORD_WEBHOOK }}
          ITEM_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PR_DISCORD_WEBHOOK is not configured"
            exit 1
          fi

          payload=$(jq -n \
            --arg content "$ITEM_URL" \
            '{
              username: "GitHub Notifications",
              allowed_mentions: {parse: []},
              content: $content
            }')

          curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$WEBHOOK_URL"
