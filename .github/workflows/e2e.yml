name: End-to-End

on:
  pull_request:
    branches: [main]
    # The suite builds the services and runs them with the gateway in Compose: it runs when one
    # of those changes, not for docs or client hooks alone.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "services/**"
      - "tests/fixtures/**"
      - "tests/e2e/**"
      - "deploy/docker/**"
      - "deploy/agentgateway/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-enforcement:
    name: Policy enforcement dataflow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker Compose E2E suite
        run: tests/e2e/run.sh
