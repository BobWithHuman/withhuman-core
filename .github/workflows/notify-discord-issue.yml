name: Notify Discord of New Issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    name: Send issue notification
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Discord
        env:
          WEBHOOK_URL: ${{ secrets.ISSUE_DISCORD_WEBHOOK }}
          ITEM_NUMBER: ${{ github.event.issue.number }}
          ITEM_TITLE: ${{ github.event.issue.title }}
          ITEM_AUTHOR: ${{ github.event.issue.user.login }}
          ITEM_BODY: ${{ github.event.issue.body }}
          ITEM_URL: ${{ github.event.issue.html_url }}
          ITEM_CREATED_AT: ${{ github.event.issue.created_at }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::ISSUE_DISCORD_WEBHOOK is not configured"
            exit 1
          fi

          description="${ITEM_BODY:-No description provided.}"
          description="${description:0:1000}"
          title="Issue #${ITEM_NUMBER}: ${ITEM_TITLE}"
          title="${title:0:256}"

          payload=$(jq -n \
            --arg title "$title" \
            --arg url "$ITEM_URL" \
            --arg description "$description" \
            --arg author "@$ITEM_AUTHOR" \
            --arg repository "$REPOSITORY" \
            --arg timestamp "$ITEM_CREATED_AT" \
            '{
              username: "GitHub Notifications",
              allowed_mentions: {parse: []},
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 5763719,
                fields: [
                  {name: "Author", value: $author, inline: true},
                  {name: "Repository", value: $repository, inline: true}
                ],
                timestamp: $timestamp
              }]
            }')

          curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$WEBHOOK_URL"
