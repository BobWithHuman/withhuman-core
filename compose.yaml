# The engine for a personal Docker host: the whole stack on one machine.
# deploy/docker/compose.yaml remains the development and E2E profile that builds from source.
# This file pulls published images and leaves out the MCP fixture. The gateway takes a host port,
# and PostgreSQL one on 127.0.0.1 for the security team's viewer, which signs in as
# withhuman_viewer (WITHHUMAN_VIEWER_PASSWORD); Redis is reachable on the Compose network alone.
#
# The variables below come from .env; see .env.example.
name: withhuman

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: withhuman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: withhuman
    # The viewer reads the graph here: postgres://withhuman_viewer@127.0.0.1:15432/withhuman.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "withhuman", "-d", "withhuman"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [engine]

  # Shared Collector state: session orders and verdicts. Append-only persistence keeps session
  # orders across a restart.
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [engine]

  decision:
    image: ${IMAGE_REGISTRY:-ghcr.io/bobwithhuman}/withhuman-decision:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      DECISION_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://withhuman:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/withhuman
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-16}
      WITHHUMAN_ENV: ${WITHHUMAN_ENV:-production}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-jev}
      JEV_URL: ${JEV_URL:-https://api.typesafe.ai}
      JEV_TIMEOUT_MS: ${JEV_TIMEOUT_MS:-3000}
      JEV_API_KEY: ${JEV_API_KEY:-}
      WITHHUMAN_INTENT_BLOCK_THRESHOLD: ${WITHHUMAN_INTENT_BLOCK_THRESHOLD:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [engine]

  generator:
    image: ${IMAGE_REGISTRY:-ghcr.io/bobwithhuman}/withhuman-generator:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      GENERATOR_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://withhuman:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/withhuman
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-16}
      DECISION_URL: http://decision:8082
      # Creates the viewer's read-only login; none while unset.
      WITHHUMAN_VIEWER_PASSWORD: ${WITHHUMAN_VIEWER_PASSWORD:-}
      # `on` copies model requests' tokens from the gateway's request log.
      WITHHUMAN_MODEL_PROXY: ${WITHHUMAN_MODEL_PROXY:-off}
    depends_on:
      postgres:
        condition: service_healthy
      decision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [engine]

  collector:
    image: ${IMAGE_REGISTRY:-ghcr.io/bobwithhuman}/withhuman-collector:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      COLLECTOR_ADDR: 0.0.0.0:8080
      COLLECTOR_EXT_AUTHZ_ADDR: 0.0.0.0:9000
      GENERATOR_URL: http://generator:8081
      REDIS_URL: redis://redis:6379
      WITHHUMAN_MODE: ${WITHHUMAN_MODE:-shadow}
      WITHHUMAN_ON_FAILURE: ${WITHHUMAN_ON_FAILURE:-closed}
      WITHHUMAN_ASK: ${WITHHUMAN_ASK:-ask}
      WITHHUMAN_DECISION_TIMEOUT_MS: ${WITHHUMAN_DECISION_TIMEOUT_MS:-4200}
      WITHHUMAN_INTENT_CAPTURE: ${WITHHUMAN_INTENT_CAPTURE:-on}
      WITHHUMAN_MCP_ENFORCE: ${WITHHUMAN_MCP_ENFORCE:-hook}
      # `on` refuses Hooks without a valid per-user key; see "Keys and the agent inventory".
      WITHHUMAN_REQUIRE_KEY: ${WITHHUMAN_REQUIRE_KEY:-off}
      WITHHUMAN_ADMIN_TOKEN: ${WITHHUMAN_ADMIN_TOKEN:-}
      # `on` checks model requests the gateway's model route passes (config.model-proxy.yaml).
      WITHHUMAN_MODEL_PROXY: ${WITHHUMAN_MODEL_PROXY:-off}
    depends_on:
      generator:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [engine]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20

  # The only service with a host port. The security group lets the load balancer alone reach it.
  agentgateway:
    image: ${AGENTGATEWAY_IMAGE:-cr.agentgateway.dev/agentgateway:v1.7.0}
    restart: unless-stopped
    command: ["-f", "/config.yaml"]
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-3000}:3000"
    # config.model-proxy.yaml adds the model route (WITHHUMAN_MODEL_PROXY=on), whose request
    # log the gateway keeps in the engine's database.
    environment:
      AGENTGATEWAY_REQUEST_LOG_URL: postgres://withhuman:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/withhuman
    volumes:
      - ./deploy/agentgateway/${AGENTGATEWAY_CONFIG:-config.yaml}:/config.yaml:ro
    depends_on:
      collector:
        condition: service_healthy
    networks: [engine]

volumes:
  postgres-data:
  redis-data:

networks:
  engine:
    name: withhuman-engine
